name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip and build
        run: |
          ZIP=$(ls *.zip | head -1)
          mkdir proj
          unzip -q "$ZIP" -d proj
          if [ -f proj/project.zip ]; then
            mkdir proj2
            unzip -q proj/project.zip -d proj2
            DIR=proj2
          else
            DIR=proj
          fi
          cd "$(dirname "$(find $DIR -name settings.gradle | head -1)")"
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/AhrefsBulkHelper.apk"

      - name: Publish APK in Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" AhrefsBulkHelper.apk \
            --title "APK build ${{ github.run_number }}" \
            --notes "Download AhrefsBulkHelper.apk and install it."

      - uses: actions/upload-artifact@v4
        with:
          name: AhrefsBulkHelper-apk
          path: AhrefsBulkHelper.apk
